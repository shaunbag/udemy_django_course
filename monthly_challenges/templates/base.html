{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Challenges{% endblock %}</title>
    <link rel="stylesheet" href="{% static "styles.css"%}">
    {% block css %}{%endblock%}
    <style>
        {% block styles %}
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        {% endblock %}
    </style>
</head>
<body>
    {% block content %}
    {% endblock %}
</body>
</html>
